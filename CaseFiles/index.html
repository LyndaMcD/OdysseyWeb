<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Submit your case file</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,300;1,8..60,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <main class="case-sheet" id="sheet">
        <h1>Submit your case file</h1>
        <p class="intro">Record what you found. Once filed, your report can't be changed, so check it before you submit.</p>

        <form id="caseForm" novalidate>
            <div class="field">
                <label for="investigator_name">Investigator name <span class="field-hint">(optional)</span></label>
                <input type="text" id="investigator_name" name="investigator_name" maxlength="60" autocomplete="nickname">
            </div>

            <div class="field">
                <label for="university">University</label>
                <input type="text" id="university" name="university" maxlength="120" required autocomplete="organization">
            </div>

            <div class="field">
                <label for="entity_name">Entity name</label>
                <input type="text" id="entity_name" name="entity_name" maxlength="120" required>
            </div>

            <div class="field">
                <label for="reference">Reference <span class="field-hint">(a book, paper or other source; include the page number if you can)</span></label>
                <textarea id="reference" name="reference" maxlength="500" required class="short"></textarea>
            </div>

            <div class="field">
                <label for="call_number">Call number <span class="field-hint">(from the spine label or the library catalogue)</span></label>
                <input type="text" id="call_number" name="call_number" maxlength="60" required>
            </div>

            <div class="field">
                <label for="findings">Findings and evidence <span class="field-hint">(optional)</span></label>
                <textarea id="findings" name="findings" maxlength="3000"></textarea>
                <div class="count" id="count">0 / 3000</div>
            </div>

            <div class="field consent">
                <input type="checkbox" id="share_publicly" name="share_publicly">
                <label for="share_publicly">Show my case file on the public case files page</label>
            </div>

            <div class="trap" aria-hidden="true">
                <label for="website">Leave this empty</label>
                <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
            </div>

            <button type="submit" id="submitBtn">File report</button>
            <p class="error" id="error" role="alert"></p>
        </form>

        <div class="stamp">
            <span aria-hidden="true">Received</span>
            <a href="case-files.html" class="stamp-link">View other case files</a>
        </div>
        <p class="done" role="status">Your case file has been filed.</p>
    </main>

    <!-- Supabase library, then your connection details -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/config.js"></script>
    <script>
        const db = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);

        const form = document.getElementById("caseForm");
        const btn = document.getElementById("submitBtn");
        const errorBox = document.getElementById("error");
        const findings = document.getElementById("findings");
        const count = document.getElementById("count");

        findings.addEventListener("input", () => {
            count.textContent = findings.value.length + " / 3000";
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            errorBox.textContent = "";

            // Spam bots fill in the hidden field; quietly ignore them
            if (form.website.value) return;

            const entry = {
                investigator_name: form.investigator_name.value.trim() || null,
                university: form.university.value.trim(),
                entity_name: form.entity_name.value.trim(),
                reference: form.reference.value.trim(),
                call_number: form.call_number.value.trim(),
                findings: form.findings.value.trim() || null,
                share_publicly: form.share_publicly.checked
            };

            const missing = [];
            if (!entry.university) missing.push("university");
            if (!entry.entity_name) missing.push("entity name");
            if (!entry.reference) missing.push("reference");
            if (!entry.call_number) missing.push("call number");
            if (missing.length) {
                errorBox.textContent = "Fill in your " + missing.join(", ") + " before filing.";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Filing…";

            const { error } = await db.from("case_files").insert(entry);

            if (error) {
                console.error(error);
                errorBox.textContent = "Your report wasn't filed. Check your connection and try again.";
                btn.disabled = false;
                btn.textContent = "File report";
                return;
            }

            document.getElementById("sheet").classList.add("filed");
            form.querySelectorAll("input, textarea, button").forEach(el => el.disabled = true);
        });
    </script>
</body>
</html>
